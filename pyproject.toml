[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dreamxcache"
version = "0.1.0"
description = "DREAM x CACHE Target2035 DEL-ML pipeline, early-recognition metrics and permutation-null channel validation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "biopython==1.88",
    "lightgbm>=4.7.0",
    "numpy==2.3.3",
    "openbabel-wheel==3.1.1.23",
    "pandas==2.3.2",
    "pyarrow==23.0.0",
    "rdkit==2025.9.1",
    "scikit-fingerprints==2.1.0",
    "scikit-learn==1.7.0",
    "scipy>=1.15",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# Only needed by scripts/similarity_stratify.py (GPU nearest-positive similarity).
gpu = ["torch>=2.14.0"]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scipy-stubs>=1.17.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["dreamxcache"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
